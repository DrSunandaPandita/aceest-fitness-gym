# SonarQube Configuration for ACEest Fitness & Gym (DevOps Assignment 2)
sonar.projectKey=aceest-fitness-gym
sonar.projectName=ACEest Fitness & Gym DevOps Platform
sonar.projectVersion=2.0.0

# Source & Test Code layout
sonar.sources=app.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language and Test Coverage
sonar.language=py
sonar.python.version=3.11,3.12,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.junit.reportPaths=reports/test-results.xml

# Exclusions
sonar.exclusions=code_versions/**,.venv/**,static/**,docs/**,reports/**
sonar.coverage.exclusions=tests/**,code_versions/**
