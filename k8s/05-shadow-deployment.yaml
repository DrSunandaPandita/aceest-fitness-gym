# =====================================================================
# Strategy 5: Shadow Deployment (Dark Launching / Traffic Mirroring)
# Copies real production traffic to a new candidate version asynchronously.
# The candidate processes live load, but responses are discarded,
# guaranteeing zero customer impact even if the candidate crashes.
# =====================================================================

# 1. Live Production Deployment (v1.0.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-prod
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-app
    role: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow-app
      role: production
  template:
    metadata:
      labels:
        app: aceest-shadow-app
        role: production
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0.0-prod"
            - name: APP_ENV
              value: "production"
            - name: RELEASE_COLOR
              value: "blue"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-prod-service
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-app
    role: production
spec:
  type: NodePort
  selector:
    app: aceest-shadow-app
    role: production
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30083
---
# 2. Shadow Candidate Deployment (v2.0.0 - Dark Launch Target)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-candidate
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-app
    role: shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow-app
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow-app
        role: shadow
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0-shadow"
            - name: APP_ENV
              value: "shadow-test"
            - name: RELEASE_COLOR
              value: "dark-mirror"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-candidate-service
  namespace: aceest-fitness
  labels:
    app: aceest-shadow-app
    role: shadow
spec:
  type: ClusterIP
  selector:
    app: aceest-shadow-app
    role: shadow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# 3. Ingress with Traffic Mirroring Annotation
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Transparently mirror incoming production requests to candidate service
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow-candidate-service.aceest-fitness.svc.cluster.local:5000"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-shadow-prod-service
                port:
                  number: 5000
