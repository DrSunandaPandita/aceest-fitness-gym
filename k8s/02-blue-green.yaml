# =====================================================================
# Strategy 2: Blue-Green Deployment
# Provisions two identical environments (Blue=v1.0.0, Green=v2.0.0)
# Instant traffic cutover achieved by modifying the Service label selector.
# =====================================================================

# 1. BLUE Environment (Active Baseline - v1.0.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      version: blue
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        version: blue
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_ENV
              value: "production"
            - name: RELEASE_COLOR
              value: "blue"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# 2. GREEN Environment (Next Generation - v2.0.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bluegreen
      version: green
  template:
    metadata:
      labels:
        app: aceest-bluegreen
        version: green
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_ENV
              value: "production"
            - name: RELEASE_COLOR
              value: "green"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# 3. Router Service (Points to BLUE initially, switchable to GREEN)
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-service
  namespace: aceest-fitness
  labels:
    app: aceest-bluegreen
spec:
  type: NodePort
  selector:
    app: aceest-bluegreen
    version: blue   # Switch to 'green' for instant cutover with zero downtime
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30081
