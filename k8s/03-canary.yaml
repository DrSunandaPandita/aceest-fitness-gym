# =====================================================================
# Strategy 3: Canary Release (80% Stable vs 20% Canary)
# Enables risk-free gradual release to live users
# Supports two industry patterns:
# Pattern A: Pod Replica Ratio (4 Stable : 1 Canary pods under 1 Service)
# Pattern B: Nginx Ingress Canary Annotation (canary-weight: 20)
# =====================================================================

# 1. Stable Production Fleet (80% capacity / 4 Replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest-fitness
  labels:
    app: aceest-canary-app
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary-app
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary-app
        track: stable
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_ENV
              value: "production"
            - name: RELEASE_COLOR
              value: "blue"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# 2. Canary Pilot Fleet (20% capacity / 1 Replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-pilot
  namespace: aceest-fitness
  labels:
    app: aceest-canary-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary-app
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary-app
        track: canary
    spec:
      containers:
        - name: web
          image: drsunandapandita/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_ENV
              value: "canary"
            - name: RELEASE_COLOR
              value: "green"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# 3. Canary Shared Service (Routes across all 5 pods => 80% to v1.0.0, 20% to v2.0.0)
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest-fitness
  labels:
    app: aceest-canary-app
spec:
  type: NodePort
  selector:
    app: aceest-canary-app  # Selects both track:stable and track:canary
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30082
---
# 4. Ingress-Based Weighted Canary (Alternative / Advanced Ingress Controller Pattern)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-ingress
  namespace: aceest-fitness
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-canary-service
                port:
                  number: 5000
